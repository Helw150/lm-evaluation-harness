# PopQA - Popular Questions and Answers
# Knowledge-intensive QA based on Wikipedia entities with popularity scores
# Dataset: akariasai/PopQA
tag:
  - qa
  - world_knowledge
  - factual
task: popqa
dataset_path: akariasai/PopQA
output_type: generate_until
test_split: test
doc_to_text: "Q: {{question}}\nA:"
doc_to_target: "{{obj}}"
generation_kwargs:
  until:
    - "\n"
    - "Q:"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 32
filter_list:
  - name: remove_whitespace
    filter:
      - function: remove_whitespace
      - function: take_first
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  version: 1.0
