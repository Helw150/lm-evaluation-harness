task: medmcqa_sl_verb
dataset_path: openlifescienceai/medmcqa
output_type: multiple_choice
training_split: train
validation_split: validation
test_split: validation
doc_to_text: !function utils_medmcqa.doc_to_text
doc_to_target: cop
doc_to_choice: "{{['A. ' + opa, 'B. ' + opb, 'C. ' + opc, 'D. ' + opd]}}"
should_decontaminate: true
doc_to_decontamination_query: "{{question}}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
  - metric: bpb
    aggregation: mean
    higher_is_better: false
  - metric: logprob
    aggregation: mean
    higher_is_better: true
  - metric: choice_logprob
    aggregation: mean
    higher_is_better: true
  - metric: choice_prob_norm
    aggregation: mean
    higher_is_better: true
  - metric: choice_logprob_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
